name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.22"
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate database passwords
        run: |
          for name in POSTGRES_PASSWORD DB_PASSWORD DB_MIGRATION_PASSWORD; do
            echo "$name=$(openssl rand -hex 32)"
          done > .env
      - name: Start database
        run: docker compose up -d --wait db
      - name: Run tests
        id: tests
        run: uv run --locked pytest -q -W error --alluredir=allure-results
      - name: Set up Node.js
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Generate Allure report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npx --yes allure@3.20.1 generate allure-results
      - name: Upload Allure report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Run Ruff
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
