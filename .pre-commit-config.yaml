repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: openapi
        name: openapi spec
        entry: uv run --directory backend --locked python -m app.openapi
        language: system
        files: ^backend/app/
        pass_filenames: false
      - id: api-types
        name: frontend api types
        entry: npm --prefix frontend run api:types
        language: system
        files: ^(backend/app/|docs/api/openapi\.json$)
        pass_filenames: false
      - id: biome
        name: biome check
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false
