[project]
name = "early-mind"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0,<1.21",
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.142.2,<0.143",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2,<3",
    "httpx2>=2,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
package = false

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = ["integration: requires a running PostgreSQL"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
