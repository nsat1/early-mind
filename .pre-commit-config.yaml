repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: https://github.com/biomejs/pre-commit
    rev: df12125767e3be2d945f0239811b308ff2a32c3f # frozen: v2.5.14
    hooks:
      - id: biome-check
        files: ^frontend/.*\.(tsx?|json|css)$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: openapi
        name: openapi spec
        entry: uv run --locked python -m app.openapi
        language: system
        files: ^app/
        pass_filenames: false
      - id: api-types
        name: frontend api types
        entry: npm --prefix frontend run api:types
        language: system
        files: ^(app/|docs/api/openapi\.json$)
        pass_filenames: false
