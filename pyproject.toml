[project]
name = "early-mind"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.142.2,<0.143",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
